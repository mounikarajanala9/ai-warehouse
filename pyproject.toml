[project]
name = "ai-warehouse"
version = "0.1.0"
description = "Smart Warehouse Operations & Order Fulfillment Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.main:app"
